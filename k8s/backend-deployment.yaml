apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: puzzle-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: puzzle-backend
  template:
    metadata:
      labels:
        app: puzzle-backend
    spec:
      containers:
      - name: backend
        image: puzzle-backend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: PORT
          value: "5000"
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10