apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: puzzle-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: puzzle-frontend
  template:
    metadata:
      labels:
        app: puzzle-frontend
    spec:
      containers:
      - name: frontend
        image: puzzle-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "256Mi"
            cpu: "500m"
          requests:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10